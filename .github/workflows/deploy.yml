name: Deploy to Vercel

# Auto-deploy the site to Vercel production on every push to main.
# The project's Root Directory is set to `site/`, so Vercel serves site/index.html.
#
# Requires one repo secret: VERCEL_TOKEN
#   Create at https://vercel.com/account/tokens, then add under
#   Settings → Secrets and variables → Actions → New repository secret.
# The Org/Project IDs below are identifiers (not secrets) and are safe in a public repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once; newest push wins.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_hOdQlCkdDeoLkK5i07n4k2sd
      VERCEL_PROJECT_ID: prj_7e2mSR8AfXKJe2TFH8ftSuf41Yp3
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: |
          url="$(vercel deploy --prod --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
          echo "### ✅ Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
